# /etc/ssh/sshd_config.d/01-hardening.conf
# The 01 prefix matters: SSH uses the FIRST value it reads, so this wins.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
# Check with: sudo sshd -T | grep -iE "passwordauthentication|permitrootlogin|maxauthtries"
# Reload with: sudo systemctl reload ssh
